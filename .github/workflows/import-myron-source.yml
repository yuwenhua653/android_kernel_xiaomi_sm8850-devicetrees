name: Import verified Myron source history
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-myron-source.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'yuwenhua653/android_kernel_xiaomi_sm8850-devicetrees'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Import exact source branch with history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --bare source.git
          cd source.git
          git fetch --no-tags https://github.com/yuwenhua653/oppo_oplus_realme_sm8850.git refs/heads/myron/native-devicetrees
          test "$(git rev-parse FETCH_HEAD)" = 'fb892731a9b9df5ecd076409536d172e564b6850'
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = '87f14b57f8dfe67edb02bda1f928b0170c99092f'
          git fsck --connectivity-only
          git -c credential.helper='!f() { printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; }; f' push https://github.com/yuwenhua653/android_kernel_xiaomi_sm8850-devicetrees.git FETCH_HEAD:refs/heads/lineage-24.0 FETCH_HEAD:refs/heads/myron/native-devicetrees
          printf 'Imported commit: %s\nVerified tree: %s\n' 'fb892731a9b9df5ecd076409536d172e564b6850' '87f14b57f8dfe67edb02bda1f928b0170c99092f' >> "$GITHUB_STEP_SUMMARY"
